[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rustializer"
version = "0.1.0"
description = "Native DRF serializer engine feasibility experiments"
requires-python = ">=3.10"

[tool.maturin]
module-name = "rustializer._feasibility"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
