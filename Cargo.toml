[package]
name = "rustializer"
version = "0.1.0"
edition = "2024"
description = "Native serialization and validation engine for existing Django REST Framework applications"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
serde_json = "1"
